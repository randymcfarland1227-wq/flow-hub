<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow</title>
<meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231a1d21%22/><path d=%22M6 11c5 0 5 5 10 5s5-5 10-5M6 18c5 0 5 5 10 5s5-5 10-5%22 fill=%22none%22 stroke=%22%23e6b450%22 stroke-width=%222.4%22 stroke-linecap=%22round%22/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3c">
</head>
<body>

<!-- ===================== TOP BAR ===================== -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#overview" aria-label="Flow home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M6 11c5 0 5 5 10 5s5-5 10-5M6 18c5 0 5 5 10 5s5-5 10-5"/></svg>
      <span class="brand-name">Flow</span>
    </a>

    <nav class="nav" id="nav" aria-label="Main">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#goals" data-view="goals">Goals</a>
      <a href="#routines" data-view="routines">Routines</a>
      <div class="nav-menu" id="areasMenu">
        <button type="button" class="nav-menu-btn" data-view="area" aria-haspopup="true" aria-expanded="false">Areas<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg></button>
        <div class="mega" id="mega" role="menu"></div>
      </div>
      <a href="#review" data-view="review">Review</a>
    </nav>

    <div class="topbar-right">
      <button type="button" class="install-btn" id="installBtn" hidden>Install Flow</button>
      <a class="review-chip" id="reviewChip" href="#review"></a>
      <span class="sync" id="syncState" title="Loading…"><i></i></span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light / dark">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- Mobile tab bar -->
<nav class="tabbar" id="tabbar" aria-label="Main">
  <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24"><path d="M3 8c4 0 4 4 9 4s5-4 9-4M3 15c4 0 4 4 9 4s5-4 9-4"/></svg><span>Overview</span></a>
  <a href="#goals" data-view="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg><span>Goals</span></a>
  <a href="#routines" data-view="routines"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Routines</span></a>
  <button type="button" data-view="area" id="tabAreas"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Areas</span></button>
  <a href="#review" data-view="review"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg><span>Review</span></a>
</nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="sheet" id="areaSheet" hidden></div>
<div class="tooltip" id="tooltip" hidden></div>

<script src="js/config.js?v=3c"></script>
<script src="js/data.js?v=3c"></script>
<script src="js/activity.js?v=3c"></script>
<script src="js/app.js?v=3c"></script>
<script src="js/install.js?v=1"></script>
</body>
</html>
